<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- Rabby blue-purple background -->
  <rect width="96" height="96" rx="20" fill="#7B3FE4"/>
  <!-- Rabbit ears -->
  <ellipse cx="36" cy="24" rx="7" ry="16" fill="white" opacity="0.95"/>
  <ellipse cx="60" cy="24" rx="7" ry="16" fill="white" opacity="0.95"/>
  <!-- Inner ear -->
  <ellipse cx="36" cy="24" rx="3.5" ry="11" fill="#C8A4F8"/>
  <ellipse cx="60" cy="24" rx="3.5" ry="11" fill="#C8A4F8"/>
  <!-- Rabbit head -->
  <ellipse cx="48" cy="54" rx="24" ry="22" fill="white" opacity="0.95"/>
  <!-- Eyes -->
  <circle cx="40" cy="50" r="4.5" fill="#7B3FE4"/>
  <circle cx="56" cy="50" r="4.5" fill="#7B3FE4"/>
  <circle cx="41" cy="49" r="1.5" fill="white"/>
  <circle cx="57" cy="49" r="1.5" fill="white"/>
  <!-- Nose -->
  <ellipse cx="48" cy="60" rx="3" ry="2" fill="#E8A0C0"/>
  <!-- Mouth -->
  <path d="M44 62 Q48 66 52 62" stroke="#7B3FE4" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Cheeks -->
  <ellipse cx="34" cy="60" rx="5" ry="3" fill="#E8A0C0" opacity="0.5"/>
  <ellipse cx="62" cy="60" rx="5" ry="3" fill="#E8A0C0" opacity="0.5"/>
</svg>
