<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- MetaMask fox simplified -->
  <rect width="96" height="96" rx="20" fill="#1A1A1A"/>
  <!-- Left ear -->
  <polygon points="14,16 28,44 10,44" fill="#E4761B" stroke="#E4761B" stroke-linejoin="round"/>
  <!-- Right ear -->
  <polygon points="82,16 68,44 86,44" fill="#E4761B" stroke="#E4761B" stroke-linejoin="round"/>
  <!-- Main face -->
  <polygon points="28,44 48,20 68,44 58,68 38,68" fill="#E4761B"/>
  <!-- Lighter face overlay -->
  <polygon points="36,50 48,24 60,50 52,64 44,64" fill="#F6851B"/>
  <!-- White nose area -->
  <ellipse cx="48" cy="64" rx="8" ry="6" fill="#C0AC9D"/>
  <!-- Left eye -->
  <ellipse cx="38" cy="50" rx="4" ry="5" fill="#fff"/>
  <ellipse cx="38" cy="51" rx="2.5" ry="3" fill="#161616"/>
  <!-- Right eye -->
  <ellipse cx="58" cy="50" rx="4" ry="5" fill="#fff"/>
  <ellipse cx="58" cy="51" rx="2.5" ry="3" fill="#161616"/>
  <!-- Nose -->
  <ellipse cx="48" cy="65" rx="3" ry="2" fill="#763D16"/>
  <!-- Mouth -->
  <path d="M44 69 Q48 73 52 69" stroke="#763D16" stroke-width="1.5" fill="none" stroke-linecap="round"/>
</svg>
